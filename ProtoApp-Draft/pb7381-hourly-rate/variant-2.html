<!DOCTYPE html>
<html lang="ru" data-mode="mobile">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PB-7381 · Вариант 2 «Сетка 7×24»</title>
<!--
  ЭКРАН: карточка услуги → вкладка «Повременная тарификация».
  Вариант 2 «Сетка 7×24»: дни по горизонтали, часы по вертикали, в ячейке
  цвет и буква тарифа; под сеткой — легенда тарифов.

  Макет: Figma «Номенклатура V2 Redesign», секция «Вариант 2» (19138:66613),
  фрейм «Включена» (19138:66614), сетка (19138:66749), легенда
  (19138:66860 — чипы «Базовая цена (100,00 ₽)» и т. д.).

  Статична только обвязка; сетку и легенду рисует js/ui.js.
-->
<link rel="stylesheet" href="css/iikods.css">
<link rel="stylesheet" href="css/prototype.css">
</head>
<body class="pb-page pb-page--app" data-variant="2">

<div class="pb-app">

  <!-- ── Шапка приложения: не скроллится ─────────────────── -->
  <header class="pb-app__head">
    <!-- Header full = 110: статус-бар 55 + хром 55 (макет 19138:66613) -->
    <div class="pb-statusbar">
      <span class="pb-statusbar__time">8:00</span>
      <img class="pb-statusbar__stats" src="../../Design-System/dsr-assets/stats.svg"
           alt="" width="67" height="12">
    </div>

    <div class="pb-chrome">
      <button type="button" class="pb-chrome__btn pb-chrome__home" aria-label="Главная">
        <img src="../../Design-System/dsr-assets/home.svg" alt="" width="24" height="24">
      </button>
      <button type="button" class="pb-chrome__btn pb-chrome__address" aria-label="Адрес">
        <img class="pb-chrome__lock" src="../../Design-System/dsr-assets/lock-mobile.svg"
             alt="" width="8" height="11">
        <span class="pb-chrome__address-text">iiko</span>
      </button>
      <button type="button" class="pb-chrome__btn pb-chrome__tabs" aria-label="Открытые вкладки">1</button>
      <button type="button" class="pb-chrome__btn pb-chrome__more" aria-label="Меню">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true">
          <circle cx="12" cy="6" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="18" r="2"/>
        </svg>
      </button>
    </div>

    <div class="pb-title">
      <h1 class="pb-title__text">Бильярд</h1>
      <button type="button" class="ds-btn-icon ds-btn-icon--s ds-btn-icon--neutral ds-btn-icon--text"
              aria-label="Информация об услуге">
        <span class="ds-btn-icon__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"/></svg></span>
      </button>
    </div>

    <div class="pb-tabs">
      <div class="ds-tabs" role="tablist" aria-label="Вкладки карточки услуги">
        <button type="button" class="ds-tab" role="tab" aria-selected="false">Приготовление</button>
        <button type="button" class="ds-tab" role="tab" aria-selected="false">Доп. инфо</button>
        <button type="button" class="ds-tab ds-tab--active" role="tab" aria-selected="true">Повременная тарификация</button>
      </div>
    </div>

    <div class="pb-status">
      <label class="ds-slide-toggle">
        <span class="ds-slide-toggle__row">
          <input class="ds-slide-toggle__input" type="checkbox" id="enabled" checked>
          <span class="ds-slide-toggle__track"></span>
          <span class="ds-slide-toggle__title" id="enabled-title">Включена</span>
        </span>
      </label>
      <!-- Иконки строки состояния: ресторан (`storefront`) и настройки (`settings`).
           Icon size 24 (заказчик 11.11.2026) + подложка State: контейнер
           `ds-icon-size--6x` с модификатором `--state` (fixes.css п. 14) даёт
           hover #EBEBEB и нажатие #E0E0E0 кругом 32. Кнопка-обёртка прозрачная,
           32×32, тач-зона 48 (бриф §7.1 п.2). Названия ресторана в шапке нет. -->
      <div class="pb-status__tools">
        <button type="button" class="pb-tool" id="open-restaurant"
                aria-label="Ресторан" aria-haspopup="dialog">
          <span class="ds-icon-size ds-icon-size--6x ds-icon-size--state"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.9 8.89l-1.05-4.37c-.22-.9-1-1.52-1.91-1.52H5.05c-.9 0-1.69.62-1.91 1.52L2.1 8.89c-.24 1.02-.02 2.06.62 2.88.08.11.19.19.28.29V19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-6.94c.09-.09.2-.18.28-.28.64-.82.87-1.87.62-2.89zm-2.99-3.9l1.05 4.37c.1.42.01.84-.25 1.17-.14.18-.44.47-.94.47-.61 0-1.14-.49-1.21-1.14L16.98 5l1.93-.01zM13 5h1.96l.54 4.52c.05.39-.07.78-.33 1.07-.22.26-.54.41-.95.41-.67 0-1.22-.59-1.22-1.31V5zM8.49 9.52L9.04 5H11v4.69c0 .72-.55 1.31-1.29 1.31-.34 0-.65-.15-.89-.41a1.42 1.42 0 0 1-.33-1.07zm-4.45-.16L5.05 5h1.97l-.58 4.86c-.08.65-.6 1.14-1.21 1.14-.49 0-.8-.29-.93-.47-.27-.32-.36-.75-.26-1.17zM5 19v-6.03c.08.01.15.03.23.03.87 0 1.66-.36 2.24-.95.6.6 1.4.95 2.31.95.87 0 1.68-.36 2.25-.95.58.59 1.37.95 2.25.95.88 0 1.68-.36 2.25-.95.59.59 1.38.95 2.25.95.07 0 .15-.02.23-.03V19H5z"/></svg></span>
        </button>
        <button type="button" class="pb-tool" id="open-settings" aria-label="Настройки">
          <span class="ds-icon-size ds-icon-size--6x ds-icon-size--state"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.43 12.98c.04-.32.07-.64.07-.98 0-.34-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.09-.16-.26-.25-.44-.25-.06 0-.12.01-.17.03l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.06-.02-.12-.03-.18-.03-.17 0-.34.09-.43.25l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98 0 .33.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.09.16.26.25.44.25.06 0 .12-.01.17-.03l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.06.02.12.03.18.03.17 0 .34-.09.43-.25l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zm-1.98-1.71c.04.31.05.52.05.73 0 .21-.02.43-.05.73l-.14 1.13.89.7 1.08.84-.7 1.21-1.27-.51-1.04-.42-.9.68c-.43.32-.84.56-1.25.73l-1.06.43-.16 1.13-.2 1.35h-1.4l-.19-1.35-.16-1.13-1.06-.43c-.43-.18-.83-.41-1.23-.71l-.91-.7-1.06.43-1.27.51-.7-1.21 1.08-.84.89-.7-.14-1.13c-.03-.31-.05-.54-.05-.74s.02-.43.05-.73l.14-1.13-.89-.7-1.08-.84.7-1.21 1.27.51 1.04.42.9-.68c.43-.32.84-.56 1.25-.73l1.06-.43.16-1.13.2-1.35h1.39l.19 1.35.16 1.13 1.06.43c.43.18.83.41 1.23.71l.91.7 1.06-.43 1.27-.51.7 1.21-1.07.85-.89.7.14 1.13zM12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0 6c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg></span>
        </button>
      </div>
    </div>
  </header>

  <!-- ── Расписание: единственная скроллящаяся область ──── -->
  <main class="pb-body" id="pb-body"></main>

  <!-- ── Нижняя панель: всегда видна ────────────────────── -->
  <div class="pb-bottombar">
    <!-- Футер выделения — карточка ВМЕСТО панели (макет 375×152, радиус 16 сверху,
         тень 01 dp, поля 16, 16 до кнопок M): появляется только при выделении
         и накрывает кнопки «Закрыть/Сохранить» -->
    <footer class="pb-selbar" id="selbar" hidden></footer>
    <div class="ds-btn-group ds-btn-group--horizontal pb-bottombar__group">
      <button type="button" class="ds-btn ds-btn--m ds-btn--neutral ds-btn--outlined pb-bottombar__btn" id="btn-close">
        <span class="ds-btn__label">Закрыть</span>
      </button>
      <button type="button" class="ds-btn ds-btn--m ds-btn--accent ds-btn--filled pb-bottombar__btn" id="btn-save">
        <span class="ds-btn__label" id="btn-save-label">Сохранить</span>
      </button>
    </div>
  </div>

</div>

<!-- ── Затемнение и шторка (пробел ДС: см. README) ─────────── -->
<button type="button" class="ds-backdrop pb-scrim" id="scrim" aria-label="Закрыть шторку" hidden></button>

<section class="pb-sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="pb-sheet__grab" data-grab aria-hidden="true">
    <span class="pb-sheet__pill"></span>
  </div>
  <div class="pb-sheet__inner" id="sheet-inner"></div>
</section>

<!-- ── Настройки: полноэкранный список из четырёх строк ──── -->
<section class="pb-screen" id="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
  <div class="pb-screen__head">
    <h2 class="pb-screen__title" id="settings-title">Настройки</h2>
    <button type="button" class="pb-close" id="settings-close" aria-label="Закрыть настройки">
      <span class="ds-icon-size ds-icon-size--6x"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18.3 5.7-1.4-1.4L12 9.2 7.1 4.3 5.7 5.7 10.6 10.6 5.7 15.5l1.4 1.4L12 12l4.9 4.9 1.4-1.4-4.9-4.9z"/></svg></span>
    </button>
  </div>
  <div class="pb-screen__body">
    <button type="button" class="ds-list-item" data-settings-row="mode">
      <span class="ds-list-item__content">
        <span class="ds-list-item__text">Режим тарификации</span>
        <span class="ds-list-item__label-down" data-value="mode">По абсолютному времени</span>
      </span>
      <span class="ds-list-item__element-right"><span class="ds-list-item__icon-size"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.3 5.7 8 7l5 5-5 5 1.3 1.3L15.6 12z"/></svg></span></span>
    </button>
    <button type="button" class="ds-list-item" data-settings-row="rounding">
      <span class="ds-list-item__content">
        <span class="ds-list-item__text">Округлять время до</span>
        <span class="ds-list-item__label-down" data-value="rounding">00:01</span>
      </span>
      <span class="ds-list-item__element-right"><span class="ds-list-item__icon-size"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.3 5.7 8 7l5 5-5 5 1.3 1.3L15.6 12z"/></svg></span></span>
    </button>
    <button type="button" class="ds-list-item" data-settings-row="minTime">
      <span class="ds-list-item__content">
        <span class="ds-list-item__text">Минимальное время</span>
        <span class="ds-list-item__label-down" data-value="minTime">Выключено</span>
      </span>
      <span class="ds-list-item__element-right"><span class="ds-list-item__icon-size"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.3 5.7 8 7l5 5-5 5 1.3 1.3L15.6 12z"/></svg></span></span>
    </button>
    <button type="button" class="ds-list-item" data-settings-row="price">
      <span class="ds-list-item__content">
        <span class="ds-list-item__text">Отображение цены</span>
        <span class="ds-list-item__label-down" data-value="price">За час</span>
      </span>
      <span class="ds-list-item__element-right"><span class="ds-list-item__icon-size"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.3 5.7 8 7l5 5-5 5 1.3 1.3L15.6 12z"/></svg></span></span>
    </button>
  </div>
</section>

<!-- ── Снэкбар ────────────────────────────────────────────── -->
<div class="pb-snackbar" id="snackbar" role="status" aria-live="polite" hidden></div>

<script src="js/data.js"></script>
<script src="js/schedule.js"></script>
<script src="js/selection.js"></script>
<script src="js/ui.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    window.PB7381_UI.init({ variant: 2 });
  });
</script>
</body>
</html>
